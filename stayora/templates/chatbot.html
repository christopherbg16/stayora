<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<div id="staya-chatbot">
  <button id="staya-toggle" class="staya-toggle-btn" aria-label="Open Staya chat">
    <i class="fas fa-comment-dots"></i>
    <span class="staya-notif-dot"></span>
  </button>

  <div id="staya-window" class="staya-window hidden">
    <div class="staya-header">
      <div class="staya-avatar">
        <i class="fas fa-robot"></i>
      </div>
      <div class="staya-header-info">
        <div class="staya-name">Staya</div>
        <div class="staya-status"><span class="status-dot"></span> Online</div>
      </div>
      <button id="staya-close" class="staya-close-btn" aria-label="Close chat">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div id="staya-messages" class="staya-messages">
      <div class="staya-msg staya-msg-bot">
        <div class="staya-msg-text typewriter" id="staya-initial-greeting" data-text="Hi there! I'm Staya, your travel assistant. How can I help you today?"><span class="cursor">|</span></div>
        <div class="staya-msg-time" id="staya-initial-time">Just now</div>
      </div>
    </div>

    <div id="staya-quick-replies" class="staya-quick-replies"></div>

    <div class="staya-input-area">
      <input type="text" id="staya-input" placeholder="Type a message..." autocomplete="off" lang="en">
      <button id="staya-send" class="staya-send-btn" aria-label="Send message">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>
</div>

<style>
.staya-toggle-btn {
  position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999;
  width: 60px; height: 60px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, #c9a96e, #b8904f);
  color: #07090f; font-size: 1.6rem; cursor: pointer;
  box-shadow: 0 4px 20px rgba(201,169,110,.4);
  transition: all .3s ease; display: flex; align-items: center; justify-content: center;
}
.staya-toggle-btn:hover { transform: scale(1.08); box-shadow: 0 6px 28px rgba(201,169,110,.55); }
.staya-notif-dot {
  position: absolute; top: 2px; right: 2px;
  width: 14px; height: 14px; border-radius: 50%;
  background: #ef4444; border: 2px solid #07090f;
}
.staya-window {
  position: fixed; bottom: 5.5rem; right: 1.5rem; z-index: 9998;
  width: 380px; height: 560px; border-radius: 18px;
  background: #0d1120; border: 1px solid rgba(255,255,255,.08);
  box-shadow: 0 25px 60px rgba(0,0,0,.6);
  display: flex; flex-direction: column; overflow: hidden;
  animation: staya-slide .3s ease;
}
@keyframes staya-slide {
  from { opacity: 0; transform: translateY(20px) scale(.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.staya-window.hidden { display: none; }

.staya-header {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 20px; background: linear-gradient(135deg, #111826, #16203a);
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.staya-avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, #c9a96e, #b8904f);
  display: flex; align-items: center; justify-content: center;
  color: #07090f; font-size: 1.2rem;
}
.staya-header-info { flex: 1; }
.staya-name { font-weight: 600; color: #eef2ff; font-size: .95rem; }
.status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #22c55e; margin-right: 4px; animation: pulse-dot 2s infinite; }
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.4} }
.staya-status { font-size: .75rem; color: #22c55e; display: flex; align-items: center; }
.staya-close-btn {
  background: none; border: none; color: #566070; font-size: 1.2rem;
  cursor: pointer; padding: 4px 8px; border-radius: 8px; transition: all .2s;
}
.staya-close-btn:hover { background: rgba(255,255,255,.06); color: #eef2ff; }

.staya-messages {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
  scroll-behavior: smooth;
}
.staya-messages::-webkit-scrollbar { width: 4px; }
.staya-messages::-webkit-scrollbar-track { background: transparent; }
.staya-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; }

.staya-msg {
  display: flex; flex-direction: column; max-width: 85%;
  animation: staya-msg-in .3s ease;
}
@keyframes staya-msg-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.staya-msg-bot { align-self: flex-start; }
.staya-msg-user { align-self: flex-end; }
.staya-msg-text {
  padding: 12px 16px; border-radius: 16px; font-size: .875rem; line-height: 1.6;
  white-space: pre-wrap;
}
.staya-msg-bot .staya-msg-text {
  background: #111826; color: #eef2ff;
  border-bottom-left-radius: 4px;
  font-family: 'Courier New', 'Consolas', monospace;
  letter-spacing: .3px;
}
.staya-msg-user .staya-msg-text {
  background: linear-gradient(135deg, #c9a96e, #b8904f);
  color: #07090f; border-bottom-right-radius: 4px;
  font-family: var(--font-body);
}
.staya-msg-time { font-size: .65rem; color: #566070; margin-top: 4px; padding: 0 4px; }

/* ── CURSOR ── */
.cursor {
  display: inline-block;
  width: 8px;
  height: 14px;
  background: #c9a96e;
  margin-left: 2px;
  animation: blink-cursor .8s step-end infinite;
  vertical-align: text-bottom;
}
@keyframes blink-cursor {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* ── ACTIONS ── */
.staya-msg-actions {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
}
.staya-action-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 10px; font-size: .8rem;
  text-decoration: none; font-weight: 500; transition: all .2s;
  cursor: pointer; border: none;
}
.staya-action-btn.primary {
  background: linear-gradient(135deg, #c9a96e, #b8904f);
  color: #07090f;
}
.staya-action-btn.primary:hover { opacity: .9; transform: translateY(-1px); }
.staya-action-btn.secondary {
  background: rgba(255,255,255,.06); color: #eef2ff;
  border: 1px solid rgba(255,255,255,.1);
}
.staya-action-btn.secondary:hover { background: rgba(255,255,255,.1); }

.staya-recommendation {
  display: flex; gap: 10px; margin-top: 10px; padding: 12px;
  background: rgba(255,255,255,.03); border-radius: 12px;
  border: 1px solid rgba(255,255,255,.06); cursor: pointer;
  transition: all .2s; text-decoration: none; color: inherit;
}
.staya-recommendation:hover { background: rgba(255,255,255,.06); border-color: rgba(201,169,110,.3); }
.staya-rec-info { flex: 1; min-width: 0; }
.staya-rec-name { font-weight: 600; color: #eef2ff; font-size: .85rem; }
.staya-rec-city { color: #566070; font-size: .75rem; }
.staya-rec-price { color: #c9a96e; font-weight: 600; font-size: .85rem; }
.staya-rec-rating { color: #fbbf24; font-size: .75rem; }

.staya-destinations {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
}
.staya-dest-chip {
  padding: 6px 14px; border-radius: 20px; font-size: .8rem;
  background: rgba(255,255,255,.06); color: #eef2ff;
  border: 1px solid rgba(255,255,255,.1); text-decoration: none; transition: all .2s;
}
.staya-dest-chip:hover { background: rgba(201,169,110,.15); border-color: rgba(201,169,110,.3); }

.staya-quick-replies {
  display: flex; gap: 6px; padding: 8px 16px; overflow-x: auto;
  scrollbar-width: none;
}
.staya-quick-replies::-webkit-scrollbar { display: none; }
.staya-quick-reply {
  flex-shrink: 0; padding: 6px 16px; border-radius: 20px; font-size: .78rem;
  background: rgba(201,169,110,.12); color: #c9a96e; border: 1px solid rgba(201,169,110,.2);
  cursor: pointer; transition: all .2s; white-space: nowrap;
}
.staya-quick-reply:hover { background: rgba(201,169,110,.2); }

.staya-input-area {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px; border-top: 1px solid rgba(255,255,255,.06);
  background: #0d1120;
}
#staya-input {
  flex: 1; padding: 10px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,.1);
  background: #111826; color: #eef2ff; font-size: .875rem; outline: none;
  transition: border-color .2s;
}
#staya-input:focus { border-color: rgba(201,169,110,.4); }
#staya-input::placeholder { color: #566070; }
.staya-send-btn {
  width: 42px; height: 42px; border-radius: 12px; border: none;
  background: linear-gradient(135deg, #c9a96e, #b8904f);
  color: #07090f; font-size: 1rem; cursor: pointer;
  transition: all .2s; display: flex; align-items: center; justify-content: center;
}
.staya-send-btn:hover { opacity: .9; }
.staya-send-btn:disabled { opacity: .4; cursor: not-allowed; }

/* Loading dots (initial) */
.staya-typing {
  display: flex; align-items: center; gap: 4px; padding: 4px 0;
}
.staya-typing span {
  width: 6px; height: 6px; border-radius: 50%;
  background: #566070; animation: staya-bounce 1.2s infinite;
}
.staya-typing span:nth-child(2) { animation-delay: .2s; }
.staya-typing span:nth-child(3) { animation-delay: .4s; }
@keyframes staya-bounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-4px); }
}

@media (max-width: 480px) {
  .staya-window {
    width: calc(100vw - 24px); height: calc(100vh - 120px);
    bottom: 5rem; right: 12px;
  }
}
</style>

<script>
(function() {
  const toggleBtn = document.getElementById('staya-toggle');
  const windowEl = document.getElementById('staya-window');
  const closeBtn = document.getElementById('staya-close');
  const messagesEl = document.getElementById('staya-messages');
  const inputEl = document.getElementById('staya-input');
  const sendBtn = document.getElementById('staya-send');
  const quickRepliesEl = document.getElementById('staya-quick-replies');
  const notifDot = document.querySelector('.staya-notif-dot');
  const statusEl = document.querySelector('.staya-status');
  const initialGreeting = document.getElementById('staya-initial-greeting');
  const initialTime = document.getElementById('staya-initial-time');

  function getCookie(name) {
    const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return match ? match.pop() : 'en';
  }

  const siteLang = getCookie('site_lang');

  const CHAT_TRANSLATIONS = {
    en: {
      greeting: "Hi there! I'm Staya, your travel assistant. How can I help you today?",
      placeholder: "Type a message...",
      status: "Online",
      justNow: "Just now",
      welcomeBack: "Welcome back! How can I help you today?",
      error: "Sorry, something went wrong. Please try again.",
      serverError: "Sorry, I could not reach the server. Please try again."
    },
    bg: {
      greeting: "Здравейте! Аз съм Стая, вашият туристически асистент. Как мога да ви помогна днес?",
      placeholder: "Напишете съобщение...",
      status: "На линия",
      justNow: "Току що",
      welcomeBack: "Добре дошли отново! Как мога да ви помогна днес?",
      error: "Съжалявам, нещо се обърка. Моля, опитайте отново.",
      serverError: "Съжалявам, не можах да се свържа със сървъра. Моля, опитайте отново."
    },
    es: {
      greeting: "Hola! Soy Staya, tu asistente de viajes. Como puedo ayudarte hoy?",
      placeholder: "Escribe un mensaje...",
      status: "En linea",
      justNow: "Ahora mismo",
      welcomeBack: "Bienvenido de nuevo! Como puedo ayudarte hoy?",
      error: "Lo siento, algo salio mal. Por favor, intentalo de nuevo.",
      serverError: "Lo siento, no pude conectar con el servidor. Por favor, intentalo de nuevo."
    },
    de: {
      greeting: "Hallo! Ich bin Staya, deine Reiseassistentin. Wie kann ich dir heute helfen?",
      placeholder: "Gib eine Nachricht ein...",
      status: "Online",
      justNow: "Gerade eben",
      welcomeBack: "Willkommen zurueck! Wie kann ich dir heute helfen?",
      error: "Entschuldigung, etwas ist schiefgelaufen. Bitte versuche es erneut.",
      serverError: "Entschuldigung, ich konnte den Server nicht erreichen. Bitte versuche es erneut."
    }
  };

  const t = CHAT_TRANSLATIONS[siteLang] || CHAT_TRANSLATIONS.en;

  if (initialGreeting) {
    initialGreeting.setAttribute('data-text', t.greeting);
  }
  if (initialTime) {
    initialTime.textContent = t.justNow;
  }
  if (statusEl) {
    statusEl.innerHTML = '<span class="status-dot"></span> ' + t.status;
  }
  inputEl.placeholder = t.placeholder;
  inputEl.lang = siteLang;

  let isOpen = false;
  let sessionData = null;
  let sessionId = crypto.randomUUID();
  let isTyping = false;

  function init() {
    fetch('/api/chat/session')
      .then(r => r.json())
      .then(data => {
        sessionData = data;
        if (data.authenticated) {
          const greeting = document.querySelector('.staya-msg-bot .staya-msg-text');
          if (greeting) {
            greeting.setAttribute('data-text', t.welcomeBack);
            greeting.innerHTML = '<span class="cursor">|</span>';
            typeWriter(greeting, 10);
          }
        }
        if (data.authenticated) {
          notifDot.style.display = 'none';
        }
      })
      .catch(() => {});
  }

  toggleBtn.addEventListener('click', () => {
    isOpen = !isOpen;
    windowEl.classList.toggle('hidden', !isOpen);
    if (isOpen) {
      messagesEl.scrollTop = messagesEl.scrollHeight;
      inputEl.focus();
    }
  });

  closeBtn.addEventListener('click', () => {
    isOpen = false;
    windowEl.classList.add('hidden');
  });

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function addMessage(text, type, time) {
    const div = document.createElement('div');
    div.className = `staya-msg staya-msg-${type}`;
    const t = time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    div.innerHTML = `<div class="staya-msg-text">${escapeHtml(text)}</div><div class="staya-msg-time">${t}</div>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addTypingDots() {
    const div = document.createElement('div');
    div.className = 'staya-msg staya-msg-bot';
    div.id = 'staya-typing-indicator';
    div.innerHTML = '<div class="staya-msg-text"><div class="staya-typing"><span></span><span></span><span></span></div></div>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function removeTypingDots() {
    const el = document.getElementById('staya-typing-indicator');
    if (el) el.remove();
  }

  function typeWriter(element, speed) {
    const text = element.getAttribute('data-text') || '';

    let index = 0;
    isTyping = true;
    element.innerHTML = '';

    let cursorSpan = document.createElement('span');
    cursorSpan.className = 'cursor';
    cursorSpan.textContent = '|';

    function type() {
      if (index < text.length) {
        element.innerHTML = '';
        element.textContent = text.substring(0, index + 1);
        cursorSpan = document.createElement('span');
        cursorSpan.className = 'cursor';
        cursorSpan.textContent = '|';
        element.appendChild(cursorSpan);
        index++;
        messagesEl.scrollTop = messagesEl.scrollHeight;
        const delay = text.charAt(index - 1) === '\n' ? speed * 4 : speed;
        setTimeout(type, delay);
      } else {
        isTyping = false;
      }
    }
    type();
  }

  function addBotResponse(response, options = {}) {
      const { animate = true, time = null } = options;
      const text = response.text || 'How can I help you?';
      const div = document.createElement('div');
      div.className = 'staya-msg staya-msg-bot';
      const t = time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      // Create the text container with typewriter data
      const textEl = document.createElement('div');
      textEl.className = 'staya-msg-text typewriter';
      textEl.setAttribute('data-text', text);
      if (!animate) {
        textEl.textContent = text;
      } else {
        textEl.innerHTML = '<span class="cursor">|</span>';
      }
      div.appendChild(textEl);

      const timeEl = document.createElement('div');
      timeEl.className = 'staya-msg-time';
      timeEl.textContent = t;
      div.appendChild(timeEl);

      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      if (animate) {
        typeWriter(textEl, 8);
      } else {
        isTyping = false;
      }

      const checkDone = setInterval(() => {
        if (!isTyping) {
          clearInterval(checkDone);

          let html = '';

          if (response.booking_summary) {
            html += `<div class="staya-booking-summary"><strong>You have ${response.booking_summary.total} active booking${response.booking_summary.total > 1 ? 's' : ''}.</strong></div>`;
          }

          if (response.destinations) {
            html += `<div class="staya-destinations">`;
            response.destinations.forEach(d => {
              const url = `/user/stays/search?destination=${encodeURIComponent(d.name)}`;
              html += `<a href="${url}" class="staya-dest-chip">${escapeHtml(d.name)}, ${escapeHtml(d.country)}</a>`;
            });
            html += `</div>`;
          }

          if (response.promotions) {
            response.promotions.forEach(p => {
              html += `<div class="staya-promo"><strong>${escapeHtml(p.name)}</strong><br>${escapeHtml(p.description)}</div>`;
            });
          }

          if (response.recommendations) {
            response.recommendations.forEach(r => {
              const url = `/user/hotel/${r.id}`;
              html += `<a href="${url}" class="staya-recommendation">
                <div class="staya-rec-info">
                  <div class="staya-rec-name">${escapeHtml(r.name)}</div>
                  <div class="staya-rec-city">${escapeHtml(r.city || '')}</div>
                </div>
                <div style="text-align:right">
                  <div class="staya-rec-price">€${r.price || 0}</div>
                  <div class="staya-rec-rating">${r.rating ? r.rating + '/5' : 'New'}</div>
                </div>
              </a>`;
            });
          }

          if (response.properties) {
            html += `<div class="staya-properties">`;
            response.properties.forEach(p => {
              const url = `/user/hotel/${p.id}`;
              html += `<a href="${url}" class="staya-property-card">
                <div class="staya-property-name">${escapeHtml(p.name)}</div>
                <div class="staya-property-meta">${escapeHtml(p.city || '')} · ${escapeHtml(p.property_type || '')}</div>
                <div class="staya-property-details">€${p.price_per_night || p.price || 0}/night · ${p.avg_rating ? p.avg_rating + '/5' : 'New'}</div>
              </a>`;
            });
            html += `</div>`;
          }

          if (response.navigate) {
            response.actions = response.actions || [];
            response.actions.unshift({ label: 'Show results', url: response.navigate, primary: true });
          }

          if (response.actions && response.actions.length > 0) {
            html += `<div class="staya-msg-actions">`;
            response.actions.forEach(a => {
              html += `<a href="${a.url}" class="staya-action-btn ${a.primary ? 'primary' : 'secondary'}">${escapeHtml(a.label)}</a>`;
            });
            html += `</div>`;
          }
          if (response.quick_replies && response.quick_replies.length > 0) {
            showQuickReplies(response.quick_replies);
          } else {
            clearQuickReplies();
          }
        }
      }, 50);
    }

  function clearQuickReplies() {
    quickRepliesEl.innerHTML = '';
  }

  function sendMessage() {
    const msg = inputEl.value.trim();
    if (!msg) return;

    addMessage(escapeHtml(msg), 'user');
    inputEl.value = '';
    sendBtn.disabled = true;
    clearQuickReplies();

    const typing = addTypingDots();

    fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, session_id: sessionId, lang: siteLang }),
    })
      .then(r => r.json())
      .then(data => {
        removeTypingDots();
        sendBtn.disabled = false;
        if (data.error) {
          addMessage(t.error, 'bot');
          return;
        }
        addBotResponse(data);
        // Fallback: detect theme/language from bot text if model didn't call the function
        if (!data.theme) {
          var textLower = (data.text || '').toLowerCase();
          if (/\b(?:dark mode|dark theme|switch to dark|go dark|turn on dark)\b/.test(textLower)) {
            data.theme = 'dark';
          } else if (/\b(?:light mode|light theme|switch to light|go light|turn on light)\b/.test(textLower)) {
            data.theme = 'light';
          }
        }
        if (!data.language && !data.navigate) {
          var textLower = (data.text || '').toLowerCase();
          var langMatch = textLower.match(/\b(?:change|switch)\s+(?:the\s+)?language\s+to\s+(\w+)\b/);
          if (langMatch) {
            var langNames = {english: 'en', bulgarian: 'bg', spanish: 'es', german: 'de'};
            if (langNames[langMatch[1]]) {
              data.language = langNames[langMatch[1]];
            }
          }
        }
        if (data.language && !data.navigate) {
          data.navigate = '/set-language/' + data.language;
        }
        if (data.navigate) {
          setTimeout(() => {
            window.location.href = data.navigate;
          }, 1200);
        }
        if (data.theme) {
          var curTheme = localStorage.getItem('theme') || 'light';
          if (curTheme !== data.theme && typeof toggleTheme === 'function') {
            toggleTheme();
          }
        }
        if (data.rename_username) {
          var rn = data.rename_username;
          if (rn.new_username) {
            document.querySelector('.staya-header-info .staya-name') &&
              (document.querySelector('.staya-header-info .staya-name').textContent = rn.new_username);
          }
        }
      })
      .catch(err => {
        removeTypingDots();
        sendBtn.disabled = false;
        addMessage(t.serverError, 'bot');
      });
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });

  // Auto-type the initial greeting
  setTimeout(() => {
    const greeting = document.querySelector('.staya-msg-bot .staya-msg-text');
    if (greeting && greeting.getAttribute('data-text')) {
      typeWriter(greeting, 10);

  init();
