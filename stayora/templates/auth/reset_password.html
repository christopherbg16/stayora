{% extends "base.html" %}

{% block title %}Reset Password — Stayora{% endblock %}

{% block extra_css %}
<style>
.auth-page {
    min-height: calc(100vh - 68px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
}
.auth-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2.5rem;
    width: 100%;
    max-width: 440px;
    box-shadow: var(--shadow-lg);
}
.auth-logo {
    font-family: var(--font-display);
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--text-light);
    text-align: center;
    margin-bottom: 1rem;
}
.auth-logo span { color: var(--primary); }
.auth-title {
    font-size: 1.3rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
    text-align: center;
}
.auth-subtitle {
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 1.5rem;
}
.form-group { margin-bottom: 1rem; }
.input-wrapper {
    position: relative;
}
.input-wrapper .input-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
}
.input-wrapper input {
    padding-left: 2.5rem !important;
}
.btn-auth {
    width: 100%;
    padding: 0.8rem;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
    color: white;
    font-weight: 600;
}
.auth-switch {
    text-align: center;
    margin-top: 1.25rem;
    font-size: 0.9rem;
    color: var(--text-muted);
}
.auth-switch a {
    color: var(--primary);
    text-decoration: none;
}
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo"><i class="fas fa-gem me-2" style="color: var(--primary);"></i>Stay<span>Ora</span></div>
        <div class="auth-title">Set a new password</div>
        <p class="auth-subtitle">Enter the 6-digit code we sent to {{ email }} and choose a new password.</p>

        <form method="POST">
            <input type="hidden" name="email" value="{{ email }}">

            <div class="form-group">
                <label class="form-label">Verification code</label>
                <div class="input-wrapper">
                    <i class="fas fa-shield-alt input-icon"></i>
                    <input type="text" name="verification_code" class="form-control" placeholder="123456" maxlength="6" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">New password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" name="new_password" class="form-control" placeholder="Enter a new password" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm new password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Repeat your password" required>
                </div>
            </div>

            <button type="submit" class="btn-auth">Reset password</button>
        </form>

        <div class="auth-switch">
            <a href="{{ url_for('auth.login') }}">Back to sign in</a>
        </div>
    </div>
</div>
{% endblock %}
